name: Build Windows EXE

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build executable
        run: pyinstaller ProcureMap.spec --noconfirm --clean

      - name: Package executable
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          Compress-Archive -Path "dist/ProcureMap.exe" -DestinationPath "ProcureMap-$tag-windows.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProcureMap-windows
          path: ProcureMap-${{ github.ref_name }}-windows.zip

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: ProcureMap-${{ github.ref_name }}-windows.zip
